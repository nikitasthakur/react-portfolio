<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="CareLoop Falls clinical review workspace">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#141031"/>
    </linearGradient>
    <linearGradient id="teal4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" fill="url(#bg4)"/>
  <!-- loop -->
  <circle cx="360" cy="225" r="130" fill="none" stroke="#1e2a4d" stroke-width="22"/>
  <path d="M 360 95 A 130 130 0 1 1 248 290" fill="none" stroke="url(#teal4)" stroke-width="22" stroke-linecap="round"/>
  <path d="M236 302 L252 268 L274 300 Z" fill="#22d3ee"/>
  <!-- pulse line through center -->
  <path d="M260 225 H320 L338 190 L362 260 L380 225 H460" fill="none" stroke="url(#violet4)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- workflow stage chips -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <g transform="translate(296,28)">
      <rect width="128" height="32" rx="16" fill="#16203f" stroke="#2dd4bf66"/>
      <text x="64" y="21" fill="#9fb3d8">fall event</text>
    </g>
    <g transform="translate(548,209)">
      <rect width="128" height="32" rx="16" fill="#16203f" stroke="#2dd4bf66"/>
      <text x="64" y="21" fill="#9fb3d8">review</text>
    </g>
    <g transform="translate(296,398)">
      <rect width="128" height="32" rx="16" fill="#16203f" stroke="#2dd4bf66"/>
      <text x="64" y="21" fill="#9fb3d8">annotate</text>
    </g>
    <g transform="translate(44,209)">
      <rect width="128" height="32" rx="16" fill="#16203f" stroke="#a78bfa66"/>
      <text x="64" y="21" fill="#9fb3d8">close loop</text>
    </g>
  </g>
  <text x="360" y="320" fill="#e2e8f0" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">CareLoop Falls</text>
  <text x="360" y="344" fill="#9fb3d8" font-family="monospace" font-size="13" text-anchor="middle">CAIDF hackathon</text>
</svg>
